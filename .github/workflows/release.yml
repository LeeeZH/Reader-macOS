name: Release

# 推 v* tag 时自动：构建 → 单测 → 打包 zip → 发 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          uname -m
          swiftc --version 2>&1 | head -2
          echo "ref=$GITHUB_REF_NAME"

      - name: 构建 / 测试 / 打包
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="Reader-${VERSION}-macos-arm64.zip"
          {
            echo "=== VERSION=$VERSION  ZIP=$ZIP ==="
            # 固定图标时间戳：避免 CI 里因 checkout 时间导致重新生成图标
            touch Resources/AppIcon.icns
            echo ""
            echo "=== 1/3 ./build.sh ==="
            ./build.sh
            echo ""
            echo "=== 2/3 ./test.sh ==="
            ./test.sh
            echo ""
            echo "=== 3/3 打包 ==="
            ditto -c -k --sequesterRsrc --keepParent dist/Reader.app "$ZIP"
            shasum -a 256 "$ZIP" > SHA256SUMS.txt
            cat SHA256SUMS.txt
            echo ""
            echo "=== OK ==="
          } 2>&1 | tee /tmp/ci.log
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: 失败时把完整日志推到 ci-debug 分支
        if: steps.build.outcome != 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "# CI 失败日志"
            echo ""
            echo "- run: \`${{ github.run_id }}\`"
            echo "- ref: \`${{ github.ref_name }}\`"
            echo "- 退出码: \`${{ steps.build.outputs.rc }}\`"
            echo ""
            echo '```text'
            cat /tmp/ci.log 2>/dev/null || echo "(没有日志文件)"
            echo '```'
          } > ci-failure.md
          git checkout -B ci-debug
          git add -f ci-failure.md
          git commit -m "CI 失败日志（run ${{ github.run_id }}）"
          git push --force origin ci-debug
          exit 1

      - name: 发布 Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: Reader ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            Reader-*-macos-arm64.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
